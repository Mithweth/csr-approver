suite: serviceaccount
templates:
  - serviceaccount.yaml
release:
  name: csr-approver
  namespace: kube-system
tests:
  - it: renders a service account by default
    set:
      serviceAccount:
        create: true
        name: ""
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: csr-approver
      - equal:
          path: metadata.namespace
          value: kube-system

  - it: renders nothing when serviceAccount.create is false
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: uses serviceAccount.name when provided
    set:
      serviceAccount:
        name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa
