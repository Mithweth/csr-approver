suite: rolebinding
templates:
  - rolebinding.yaml
release:
  name: csr-approver
  namespace: kube-system
tests:
  - it: renders nothing when replicaCount is 1
    set:
      replicaCount: 1
    asserts:
      - hasDocuments:
          count: 0

  - it: binds the leases Role to the service account when replicaCount is greater than 1
    set:
      replicaCount: 2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: RoleBinding

  - it: binds the machines Role to the service account when a rule requires machine validation
    set:
      replicaCount: 1
      approvalRules:
        - signerName: kubernetes.io/kubelet-serving
          machineValidation: required
      machineNamespace: machine-ns
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: RoleBinding
      - equal:
          path: metadata.name
          value: csr-approver-machines
      - equal:
          path: roleRef.name
          value: csr-approver-machines
      - equal:
          path: subjects[0].namespace
          value: kube-system

  - it: does not render a machines RoleBinding when every rule disables machine validation
    set:
      replicaCount: 1
      approvalRules:
        - signerName: kubernetes.io/kubelet-serving
          machineValidation: disabled
    asserts:
      - hasDocuments:
          count: 0
