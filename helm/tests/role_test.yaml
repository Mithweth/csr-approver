suite: role
templates:
  - role.yaml
release:
  name: csr-approver
  namespace: kube-system
tests:
  - it: renders nothing when replicaCount is 1
    set:
      replicaCount: 1
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a leases Role when replicaCount is greater than 1
    set:
      replicaCount: 2
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Role

  - it: renders a machines Role when a rule requires machine validation
    set:
      replicaCount: 1
      approvalRules:
        - signerName: kubernetes.io/kubelet-serving
          machineValidation: required
      machineNamespace: kube-system
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: csr-approver-machines
      - equal:
          path: metadata.namespace
          value: kube-system

  - it: does not render a machines Role when every rule disables machine validation
    set:
      replicaCount: 1
      approvalRules:
        - signerName: kubernetes.io/kubelet-serving
          machineValidation: disabled
    asserts:
      - hasDocuments:
          count: 0
