---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "csr-approver.fullname" . }}
rules:
  - apiGroups:
      - certificates.k8s.io
    resources:
      - certificatesigningrequests
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - certificates.k8s.io
    resources:
      - certificatesigningrequests/approval
    verbs:
      - update
  - apiGroups:
      - certificates.k8s.io
    resources:
      - signers
    {{- with .Values.approvalRules }}
    resourceNames:
    {{- range $rule := . }}
      - {{ $rule.signerName }}
    {{- end }}
    {{- end }}
    verbs:
      - approve
