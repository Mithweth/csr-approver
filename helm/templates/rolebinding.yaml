{{- if gt (int .Values.replicaCount) 1 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "csr-approver.fullname" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "csr-approver.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "csr-approver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if eq (include "csr-approver.needsMachineRole" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "csr-approver.fullname" . }}-machines
  namespace: {{ .Values.machineNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "csr-approver.fullname" . }}-machines
subjects:
  - kind: ServiceAccount
    name: {{ include "csr-approver.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
