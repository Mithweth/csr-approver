{{- if gt (int .Values.replicaCount) 1 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "csr-approver.fullname" . }}
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
  {{- /* Not migrated to events.k8s.io https://github.com/kubernetes/kubernetes/issues/82846 */}}
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
{{- end }}
{{- if eq (include "csr-approver.needsMachineRole" .) "true" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "csr-approver.fullname" . }}-machines
  namespace: {{ .Values.machineNamespace }}
rules:
  - apiGroups:
      - cluster.x-k8s.io
    resources:
      - machines
    verbs:
      - get
{{- end }}
