name: Test and lint

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        shell: bash
        run: |
          go vet ./...
          go test ./...

      - name: Run linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  chart-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Run helm tests
        shell: bash
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git --version 1.1.2 --verify=false &> /dev/null
          helm unittest --strict helm/

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }} --chart-dirs .)
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        working-directory: ./helm
        run: |
          ct lint --target-branch ${{ github.event.repository.default_branch }} \
            --chart-yaml-schema configs/chart_schema.yaml \
            --config configs/ct-lint.yaml --lint-conf configs/lintconf.yaml

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.14.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        working-directory: ./helm
        run: |
          ct install --target-branch ${{ github.event.repository.default_branch }} \
            --config configs/ct-lint.yaml --charts .

