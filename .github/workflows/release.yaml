name: Release

on:
  release:
    types: 
      - published

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR for Helm
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
              --username "${{ github.actor }}" --password-stdin

      - name: Set version
        shell: bash
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/mithweth/csr-approver:${{ env.VERSION }}
            ghcr.io/mithweth/csr-approver:latest
          labels: |
            org.opencontainers.image.title=csr-approver
            org.opencontainers.image.description=Rule-based Kubernetes CSR approver
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}

      - name: Package Helm chart
        shell: bash
        run: |
          helm package ./helm --version "$VERSION" --app-version "$VERSION"

      - name: Push Helm chart
        shell: bash
        run: helm push "csr-approver-$VERSION.tgz" oci://ghcr.io/mithweth/charts
